<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#DC2626">
<title>You're offline — obitickets</title>
<style>
  *{box-sizing:border-box}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:#FDFCFE; color:#1C1526; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; text-align:center;}
  .card{max-width:380px;}
  .mark{width:84px; height:84px; border-radius:24px; margin:0 auto 22px; display:block; box-shadow:0 16px 36px -16px rgba(220,38,38,0.55);}
  h1{margin:0 0 10px; font-size:1.5rem; line-height:1.2;}
  p{margin:0 0 26px; color:#726C7E; line-height:1.55;}
  button{font:inherit; font-weight:700; border:0; cursor:pointer; background:#DC2626; color:#fff; padding:14px 30px; border-radius:100px;}
  button:active{transform:scale(.97)}
  .hint{margin:22px 0 0; font-size:.84rem; color:#948FA0;}
</style>
</head>
<body>
  <main class="card">
    <img class="mark" src="/assets/icons/icon-192.png" alt="obitickets">
    <h1>You're offline</h1>
    <p>We can't reach obitickets right now. Check your mobile data or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <p class="hint">Already paid? Your payment is safe — reopen the app once you're back online.</p>
  </main>
</body>
</html>
